[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bsc-watcher"
version = "0.1.0"
description = "Raw JSON-RPC tailer for PancakeSwap pool creation and mint events on BSC"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "dmitry", email = "dmitry@local" }
]
dependencies = [
    "httpx>=0.25.0",
    "eth-abi>=5.0.0",
    "eth-utils>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
bsc-watch = "bsc_watcher.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
